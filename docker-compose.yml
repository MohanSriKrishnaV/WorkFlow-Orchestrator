services:
  db:
    image: postgres:16-alpine
    container_name: wf_orchestrator_db
    environment:
      POSTGRES_DB: flowpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wf_orchestrator_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wf_orchestrator_server
    depends_on:
      - db
      - rabbitmq
    environment:
      APP_DEBUG: "true"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/flowpilot
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8000:8000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: wf_orchestrator_client
    ports:
      - "3001:80"
    restart: unless-stopped
    depends_on:
      - server

volumes:
  db-data:
